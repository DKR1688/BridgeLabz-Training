spring:
  datasource:
    # File-backed H2 keeps contacts after the application is stopped and restarted.
    url: jdbc:h2:file:./data/contactsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  jackson:
    default-property-inclusion: non_null
