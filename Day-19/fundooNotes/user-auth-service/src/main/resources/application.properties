spring.application.name=user-auth-service
server.port=8081

# Database Configuration (Defaults to in-memory H2 user_auth_db if MySQL is not reachable)
spring.datasource.url=jdbc:h2:mem:user_auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# JWT & Password Recovery Configuration
app.jwt.secret=VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC10aGF0LWlzLWxvbmc=
app.jwt.expiration-millis=3600000
app.password-reset.expiration-minutes=15

# Embedded Artemis JMS Configuration
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.jms.pub-sub-domain=false

# Redis Configuration (with automatic graceful fallback)
spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.com.bridgelabz.userauth=DEBUG
