# ===================================================================
# Centralized Shared Configuration for Fundoo Notes Microservices
# ===================================================================

# JWT Security Configuration (Zero hardcoded secrets, externalizable)
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d0e2b4a6c8e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d}
app.jwt.expiration-ms=86400000

# Shared Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Shared RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Shared ActiveMQ Artemis Configuration
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:admin}
spring.artemis.embedded.enabled=true
spring.artemis.mode=embedded

# Shared Real Email Configuration (Use Case 22)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:apikey}
spring.mail.password=${SPRING_MAIL_PASSWORD:test-key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka Registry Service URL
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
