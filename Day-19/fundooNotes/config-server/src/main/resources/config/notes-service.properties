# ===================================================================
# Notes Management Service Configuration
# ===================================================================
server.port=8082
spring.application.name=notes-service

# Database Configuration (MySQL with fallback to H2 in tests)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fundoonotes_notes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Inter-Service User Client
app.user-service.base-url=http://user-auth-service

# Resilience4j Circuit Breaker Configuration (Use Case 24)
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
