spring.application.name=notes-service
server.port=8082

# Database Configuration (Defaults to in-memory H2 notes_db if MySQL is not running)
spring.datasource.url=jdbc:h2:mem:notes_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# User Service Client Configuration (Supports both Eureka service name and direct URL)
app.user-service.base-url=http://user-auth-service

# JWT Secret Configuration
app.jwt.secret=VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC10aGF0LWlzLWxvbmc=
app.jwt.expiration-millis=3600000

# Embedded Artemis JMS Configuration
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.jms.pub-sub-domain=false

# Redis Configuration (with automatic fallback)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Batch Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.auto-startup=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

logging.level.com.bridgelabz.notes=DEBUG
