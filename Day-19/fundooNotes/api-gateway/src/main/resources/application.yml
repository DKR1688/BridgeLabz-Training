server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-auth-route
          uri: lb://user-auth-service
          predicates:
            - Path=/auth/**, /users/**, /user/**
        - id: notes-route
          uri: lb://notes-service
          predicates:
            - Path=/notes/**, /labels/**
        - id: reminder-route
          uri: lb://reminder-service
          predicates:
            - Path=/reminders/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
