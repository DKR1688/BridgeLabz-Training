spring.application.name=fundooNotes
spring.datasource.url=jdbc:h2:mem:fundoonotes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Override this value with a 32-byte-or-longer Base64 secret in production.
app.jwt.secret=VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC10aGF0LWlzLWxvbmc=
app.jwt.expiration-millis=3600000
app.password-reset.expiration-minutes=15

# Artemis JMS configuration (Embedded for asynchronous reminders & recovery)
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.jms.pub-sub-domain=false

# Redis Configuration (Use Case 9)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Batch Configuration (Use Case 11)
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# RabbitMQ Configuration (Use Case 10)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.auto-startup=false

logging.level.com.bridgelabz.fundoonotes=DEBUG
